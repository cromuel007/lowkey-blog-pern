name: Cleanup Deploy Runs

on:
  workflow_run:
    workflows:
      - Deploy Blog API
    types:
      - completed

jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Delete successful deployment run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run delete ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }}