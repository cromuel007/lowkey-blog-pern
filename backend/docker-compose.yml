services:
  postgres:
    image: postgres:16-alpine
    container_name: cms
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms
    ports:
      - "5432:5432"
    volumes:
      - cms_data:/var/lib/postgresql/data

volumes:
  cms_data:
